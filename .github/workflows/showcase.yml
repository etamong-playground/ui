# Build the component showcase and deploy it to the etamong-lab pages platform.
#
# Deploys on push to main only, and only when the PAGES_TOKEN secret is set
# (a deploy token scoped to the ui-showcase site) — the workflow stays green
# until the secret is wired up. PRs validate the showcase build via ci.yml.
#
# Live URL: https://ui-showcase.custom-site.m.etamong.com/

name: Showcase

on:
  push:
    branches: [main]
    paths:
      - src/**
      - showcase/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/showcase.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_PAGES_TOKEN: ${{ secrets.PAGES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build showcase
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          export VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm showcase:build
      - name: Deploy to pages
        if: env.HAS_PAGES_TOKEN == 'true'
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          tar czf - -C showcase/dist . | curl -fSs -X POST \
            -H "Authorization: Bearer ${PAGES_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary @- \
            "https://pages.m.etamong.com/api/v1/sites/ui-showcase/deploys?commit=${GITHUB_SHA}"
      - name: Deploy skipped (no PAGES_TOKEN)
        if: env.HAS_PAGES_TOKEN != 'true'
        run: echo "PAGES_TOKEN not configured — build validated, deploy skipped."
