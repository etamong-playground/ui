# Publish @etamong-playground/ui on tag push
#
# Trigger: workflow_dispatch — the normal path. With no `tag` input it CUTS the
#          release tag from package.json at main HEAD and publishes in the same
#          run (tags are cut by CI, never pushed by hand; a GITHUB_TOKEN-created
#          tag cannot re-trigger workflows, which is why cut+publish share a run).
#          With a `tag` input it (re)publishes that existing tag.
#          push of a tag matching v* also publishes (backstop for tags that
#          arrive by other means).
#
# Publishes to two registries in the same job:
#   1. GitHub Packages  (npm.pkg.github.com, scope @etamong-playground)
#   2. npmjs            (registry.npmjs.org,  scope @etamong-playground, public)
#
# The package name in package.json is @etamong-playground/ui — no runtime
# rename needed. publishConfig only carries "access": "public".
#
# GitHub Packages auth:  built-in GITHUB_TOKEN (packages: write)
# npmjs auth:            token-less OIDC via Trusted Publisher (id-token: write)
#                        Do NOT use setup-node registry-url for the npmjs step —
#                        it injects a placeholder NODE_AUTH_TOKEN that breaks OIDC.
#
# Release flow:
#   1. Bump version in package.json → PR → merge to main
#   2. Run this workflow (workflow_dispatch, no inputs) → CI cuts vX.Y.Z from
#      package.json and publishes. Do not push tags manually.

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)publish, e.g. v0.34.0"
        required: false
      dist_tag:
        description: "npm dist-tag (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: write   # push the CI-cut release tag (read otherwise sufficed)
  packages: write   # GitHub Packages publish
  id-token: write   # npmjs OIDC trusted publishing (provenance)

jobs:
  publish:
    name: Build + dual publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: corepack enable && corepack prepare pnpm@10 --activate

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Dispatch without a tag input = cut the release here: tag main HEAD as
      # v<package.json version>. Idempotent — an existing identical tag means
      # republish mode, a version already tagged on a DIFFERENT commit fails.
      - name: Cut release tag (dispatch without tag input)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [[ -n "$EXISTING" && "$EXISTING" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::$TAG already exists on $EXISTING (HEAD is $(git rev-parse HEAD)) — bump package.json first"; exit 1
          fi
          if [[ -z "$EXISTING" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_ENV"

      # Tag must match package.json so the published artifact stays traceable
      # to its source tag (planning#1095).
      - name: Verify tag matches package.json version
        run: |
          REF="${{ github.event.inputs.tag }}"
          [[ -z "$REF" ]] && REF="${release_tag:-${{ github.ref_name }}}"
          PKG="v$(node -p "require('./package.json').version")"
          if [[ "$REF" != "$PKG" ]]; then
            echo "::error::tag $REF != package.json $PKG"; exit 1
          fi

      - run: pnpm build

      # ── Determine dist-tag (latest vs pre-release slug) ─────────────────
      - name: Set dist-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.dist_tag }}" ]]; then
            echo "publish_tag=${{ github.event.inputs.dist_tag }}" >> "$GITHUB_ENV"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            PUBLISH_TAG="latest"
            case "$PKG_VERSION" in
              *-*)
                PRE="${PKG_VERSION#*-}"
                PUBLISH_TAG="${PRE%%.*}"
                echo "Pre-release detected — publishing to dist-tag: ${PUBLISH_TAG}"
                ;;
            esac
            echo "publish_tag=${PUBLISH_TAG}" >> "$GITHUB_ENV"
          fi

      # ── Publish to GitHub Packages ───────────────────────────────────────
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@etamong-playground:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          pnpm publish --no-git-checks --tag "${{ env.publish_tag }}" --registry https://npm.pkg.github.com

      # ── Publish to npmjs ─────────────────────────────────────────────────
      - name: Publish to npmjs (OIDC trusted publishing)
        run: |
          # Token-less OIDC: id-token: write + the npmjs Trusted Publisher. Do NOT use
          # setup-node registry-url here (it injects a placeholder NODE_AUTH_TOKEN that
          # overrides OIDC). Clear any stray npmrc; npm uses OIDC against the default
          # registry (registry.npmjs.org) and auto-attaches provenance.
          rm -f .npmrc
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          npm publish --access public
