name: publish

# Publish the package to GitHub Packages on a version tag. The repo's
# package.json still carries the legacy @etamong-lab name + a GitLab
# publishConfig; both are rewritten at publish time so the package lands as
# @etamong-playground/<name> on GitHub Packages (the org scope GitHub Packages
# requires). Uses the built-in GITHUB_TOKEN — no external PAT needed.
#
# workflow_dispatch with a `tag` input backfills already-existing tags
# (v0.28.2, v0.29.1, …) that predate this workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to (re)publish, e.g. v0.28.2'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: publish to the host's package registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PKG="@etamong-playground/$(basename "$GITHUB_REPOSITORY")"
          npm pkg set name="$PKG"
          npm pkg delete publishConfig
          # One file, both hosts: Forgejo Actions reads .github/workflows too, so
          # branch on the host and publish to that host's registry with its own
          # built-in Actions token (no cross-platform PAT). Detect by github.com
          # (always set on GitHub); anything else is the Forgejo instance — its
          # GITHUB_SERVER_URL is the internal service URL, not git.m.etamong.com.
          echo "GITHUB_SERVER_URL=${GITHUB_SERVER_URL:-<unset>}"
          case "${GITHUB_SERVER_URL:-}" in
            *github.com*)
              REG="https://npm.pkg.github.com/"; HOST="npm.pkg.github.com" ;;
            *)
              REG="https://git.m.etamong.com/api/packages/etamong-playground/npm/"
              HOST="git.m.etamong.com/api/packages/etamong-playground/npm" ;;
          esac
          printf '@etamong-playground:registry=%s\n//%s/:_authToken=%s\n' "$REG" "$HOST" "$TOKEN" > .npmrc
          echo "publishing $PKG to $REG"
          npm publish --registry="$REG"
