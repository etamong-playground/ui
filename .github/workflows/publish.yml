# Publish @etamong-playground/ui on tag push
#
# Trigger: push of a tag matching v*.*.*  (e.g. v0.32.0, v1.0.0-alpha.1)
#
# Publishes to two registries in the same job:
#   1. GitHub Packages  (npm.pkg.github.com, scope @etamong-playground)
#   2. Forgejo Packages (git.m.etamong.com,  scope @etamong-playground)
#
# The source package name is @etamong-lab/ui (GitLab origin name).
# We rename to @etamong-playground/ui before publishing.
#
# Forgejo token fetched from Vault at runtime (role: arc-runner-workflows on auth/kubernetes).
# No GitHub org/repo secrets used.
#
# Release flow:
#   1. Bump version in package.json → PR → merge to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z  → this workflow publishes

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag (default: latest)"
        required: false
        default: "latest"

jobs:
  publish:
    name: Build + dual publish
    runs-on: arc-etamong-playground
    permissions:
      contents: read
      packages: write   # needed for GitHub Packages publish

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Tag vs package.json version guard ──────────────────────────
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch: using package.json version ${PKG_VERSION}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "ERROR: tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
              exit 1
            fi
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      # ── Determine dist-tag (latest vs pre-release slug) ────────────
      - name: Set dist-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.dist_tag }}" ]]; then
            echo "publish_tag=${{ github.event.inputs.dist_tag }}" >> "$GITHUB_ENV"
          else
            PKG_VERSION="${{ env.version }}"
            PUBLISH_TAG="latest"
            case "$PKG_VERSION" in
              *-*)
                PRE="${PKG_VERSION#*-}"
                PUBLISH_TAG="${PRE%%.*}"
                echo "Pre-release detected — publishing to dist-tag: ${PUBLISH_TAG}"
                ;;
            esac
            echo "publish_tag=${PUBLISH_TAG}" >> "$GITHUB_ENV"
          fi

      # ── Fetch Forgejo npm token from Vault ─────────────────────────
      - uses: hashicorp/vault-action@v3
        with:
          url: https://vault.m.etamong.com
          method: kubernetes
          path: kubernetes
          role: arc-runner-workflows
          kubernetesTokenPath: /vault/sa/token
          secrets: |
            homelab/data/apps/forgejo/npm-publish token | FORGEJO_NPM_TOKEN

      # ── Rename package scope for publishing ────────────────────────
      - name: Rename package scope to @etamong-playground
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg._originalName = pkg.name;
            pkg.name = pkg.name.replace('@etamong-lab/', '@etamong-playground/');
            delete pkg.publishConfig;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
            console.log('Renamed:', pkg._originalName, '->', pkg.name);
          "

      # ── Publish to GitHub Packages ──────────────────────────────────
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > .npmrc <<'EOF'
          @etamong-playground:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          pnpm publish --no-git-checks --tag "${{ env.publish_tag }}" --registry https://npm.pkg.github.com

      # ── Publish to Forgejo Packages ─────────────────────────────────
      - name: Publish to Forgejo Packages
        env:
          FORGEJO_NPM_TOKEN: ${{ env.FORGEJO_NPM_TOKEN }}
        run: |
          cat > .npmrc <<'EOF'
          @etamong-playground:registry=https://git.m.etamong.com/api/packages/etamong-playground/npm/
          //git.m.etamong.com/api/packages/etamong-playground/npm/:_authToken=${FORGEJO_NPM_TOKEN}
          EOF
          pnpm publish --no-git-checks --tag "${{ env.publish_tag }}" --registry https://git.m.etamong.com/api/packages/etamong-playground/npm/

      # ── Restore original package name ──────────────────────────────
      - name: Restore original package name
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg._originalName) {
              pkg.name = pkg._originalName;
              delete pkg._originalName;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t') + '\n');
              console.log('Restored:', pkg.name);
            }
          "
