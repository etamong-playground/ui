name: publish

# Publish the package on a version tag. One file serves BOTH GitHub and Forgejo
# (Forgejo Actions reads .github/workflows too): it detects the host via
# GITHUB_SERVER_URL and publishes to that host's package registry with that
# host's built-in Actions token — GitHub Packages on github.com, Forgejo
# Packages on git.m.etamong.com. The repo's legacy @etamong-lab name + GitLab
# publishConfig are rewritten at publish time so the package lands as
# @etamong-playground/<repo>. No external PAT and no cross-platform token.
#
# workflow_dispatch with a `tag` input backfills tags that predate this file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to (re)publish, e.g. v0.28.2'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: publish to the host's package registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PKG="@etamong-playground/$(basename "$GITHUB_REPOSITORY")"
          npm pkg set name="$PKG"
          npm pkg delete publishConfig
          if printf '%s' "${GITHUB_SERVER_URL:-}" | grep -q 'git.m.etamong.com'; then
            REG="https://git.m.etamong.com/api/packages/etamong-playground/npm/"
            printf '@etamong-playground:registry=%s\n//git.m.etamong.com/api/packages/etamong-playground/npm/:_authToken=%s\n' "$REG" "$TOKEN" > .npmrc
          else
            REG="https://npm.pkg.github.com/"
            printf '@etamong-playground:registry=%s\n//npm.pkg.github.com/:_authToken=%s\n' "$REG" "$TOKEN" > .npmrc
          fi
          echo "publishing $PKG to $REG"
          npm publish --registry="$REG"
