# Publish @etamong-playground/ui on tag push
#
# Trigger: push of a tag matching v*  (e.g. v0.34.0, v1.0.0-alpha.1)
#          workflow_dispatch for bootstrap / manual re-publishes
#
# Publishes to two registries in the same job:
#   1. GitHub Packages  (npm.pkg.github.com, scope @etamong-playground)
#   2. npmjs            (registry.npmjs.org,  scope @etamong-playground, public)
#
# The package name in package.json is @etamong-playground/ui — no runtime
# rename needed. publishConfig only carries "access": "public".
#
# GitHub Packages auth:  built-in GITHUB_TOKEN (packages: write)
# npmjs auth:            NPM_TOKEN secret (bootstrap; remove once Trusted
#                        Publisher is configured — id-token: write handles
#                        OIDC token-less publish with auto-provenance)
#
# Release flow:
#   1. Bump version in package.json → PR → merge to main
#   2. git tag vX.Y.Z && git push origin vX.Y.Z  → this workflow publishes

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)publish, e.g. v0.34.0"
        required: false
      dist_tag:
        description: "npm dist-tag (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write   # GitHub Packages publish
  id-token: write   # npmjs OIDC trusted publishing (provenance)

jobs:
  publish:
    name: Build + dual publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: corepack enable && corepack prepare pnpm@10 --activate

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # ── Determine dist-tag (latest vs pre-release slug) ─────────────────
      - name: Set dist-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.dist_tag }}" ]]; then
            echo "publish_tag=${{ github.event.inputs.dist_tag }}" >> "$GITHUB_ENV"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            PUBLISH_TAG="latest"
            case "$PKG_VERSION" in
              *-*)
                PRE="${PKG_VERSION#*-}"
                PUBLISH_TAG="${PRE%%.*}"
                echo "Pre-release detected — publishing to dist-tag: ${PUBLISH_TAG}"
                ;;
            esac
            echo "publish_tag=${PUBLISH_TAG}" >> "$GITHUB_ENV"
          fi

      # ── Publish to GitHub Packages ───────────────────────────────────────
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '@etamong-playground:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          pnpm publish --no-git-checks --tag "${{ env.publish_tag }}" --registry https://npm.pkg.github.com

      # ── Publish to npmjs ─────────────────────────────────────────────────
      # Bootstrap auth: NODE_AUTH_TOKEN. After the package exists on npmjs and
      # a Trusted Publisher is configured under https://www.npmjs.com/package/@etamong-playground/ui,
      # remove NODE_AUTH_TOKEN — OIDC (id-token: write) publishes token-less
      # with auto-provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Bootstrap auth via explicit .npmrc (overrides the GitHub-Packages scope mapping
          # written by the earlier step). After a Trusted Publisher is configured on npmjs,
          # this whole step moves to setup-node registry-url + id-token OIDC (no token).
          printf '@etamong-playground:registry=https://registry.npmjs.org\n//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          pnpm publish --no-git-checks --access public --tag "${{ env.publish_tag }}" --registry https://registry.npmjs.org
