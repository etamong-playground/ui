# Shared GitLab CI snippet: viewport-fit gate for any app that consumes
# @etamong-lab/ui chrome primitives. Include from an app's .gitlab-ci.yml:
#
#   include:
#     - project: etamong-lab/shared/libs/ui
#       ref: main
#       file: ci/viewport-fit.gitlab-ci.yml
#
#   viewport-fit:
#     extends: .etu-viewport-fit
#     variables:
#       APP_DIR: frontend          # path to the directory with package.json + tests/
#       APP_URLS: "/,/settings,/me"
#
# The job:
#   1. installs deps with the pinned pnpm,
#   2. boots the app (via `pnpm run preview &` against a freshly-built dist),
#   3. runs the app's viewport-fit Playwright spec, which calls
#      `defineViewportFitTests` from `@etamong-lab/ui/testing` to fan out
#      across the FLEET_VIEWPORT_PROFILES.
#
# Apps that don't yet have a Playwright spec can opt out by not extending
# .etu-viewport-fit. Once added, the gate fails MRs that introduce any
# `[@etamong-lab/ui]` console.warn at any device profile.

.etu-viewport-fit:
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  stage: test
  variables:
    APP_DIR: frontend
    APP_URLS: "/"
    APP_PREVIEW_CMD: "pnpm exec vite preview --port 4173 --strictPort"
    APP_PREVIEW_URL: "http://127.0.0.1:4173"
  before_script:
    - corepack enable
    - cd "$APP_DIR"
    - pnpm install --frozen-lockfile
    - pnpm run build
    - $APP_PREVIEW_CMD &
    - npx --yes wait-on -t 60000 "$APP_PREVIEW_URL"
  script:
    - pnpm exec playwright test viewport-fit --reporter=line
  artifacts:
    when: on_failure
    paths:
      - $APP_DIR/playwright-report/
      - $APP_DIR/test-results/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
